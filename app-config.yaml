app:
  title: Developer Hub Dynamic Plugins Getting Started
  baseUrl: http://localhost:7007
backend:
  auth:
    keys:
      - secret: development
  baseUrl: http://localhost:7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    upgrade-insecure-requests: false
  cors:
    origin: ${BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

integrations: {}
proxy:
  endpoints: {}
auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

simpleChat:
  configProbeString: >-
    A moderately long config probe string for memory-leak testing. Repeating the
    same value on every request should not allocate new backing storage if the
    root Config object is stable and reads are cheap.

dynamicPlugins:
  rootDirectory: dynamic-plugins-root
  